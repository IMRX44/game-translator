name: release

# Builds the Windows app on GitHub's Windows runner (which can compile WPF) and
# publishes a GitHub Release with a downloadable single-file .exe when a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for a manual release build'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run cross-platform tests
        run: dotnet test tests/GameTranslator.Tests/GameTranslator.Tests.csproj -c Release

      - name: Publish single-file Windows app
        run: >
          dotnet publish src/GameTranslator.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Resolve release name
        id: name
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $ref = "${{ github.event.inputs.tag }}" }
          echo "tag=$ref" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "GameTranslator-${{ steps.name.outputs.tag }}-win-x64.zip" -Force

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.name.outputs.tag }}" `
            "GameTranslator-${{ steps.name.outputs.tag }}-win-x64.zip" `
            --title "GameTranslator ${{ steps.name.outputs.tag }}" `
            --notes "مترجم زندهٔ روی صفحه برای بازی‌های ویندوزی. فایل zip را دانلود و GameTranslator.exe را اجرا کنید. نیاز به نصب یک پک زبان OCR ویندوز دارد — راهنما در docs/BUILD-WINDOWS.md."

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-${{ steps.name.outputs.tag }}-win-x64
          path: GameTranslator-*.zip
